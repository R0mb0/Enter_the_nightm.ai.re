<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        /* Black screen, no scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            cursor: none; /* Hide cursor for added anxiety */
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main text container: always above the pentagram */
        .glitch-wrapper {
            position: relative;
            z-index: 10;
            padding: 0 16px;
            font-size: clamp(1.6rem, 7vw, 4rem);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            text-shadow: 0 0 6px #000, 0 0 18px #000; /* readable over the red pentagram too */
        }

        .glitch-text {
            position: relative;
            color: #fff;
            white-space: nowrap;
        }

        /* Chromatic aberration (red and cyan) */
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch-text::before {
            left: 4px;
            text-shadow: -2px 0 #ff0000;
            clip-path: inset(20% 0 80% 0);
            animation: glitch-anim-1 0.6s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -4px;
            text-shadow: -2px 0 #00ffff;
            clip-path: inset(80% 0 5% 0);
            animation: glitch-anim-2 0.9s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -1px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 2px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(2px, -2px); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, 2px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -2px); }
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, 1px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(2px, -2px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translate(-2px, 2px); }
        }

        /* Extreme shaking for the final phase */
        .shake-active { animation: shake 0.3s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-3px, 0px) rotate(1deg); }
            50% { transform: translate(2px, -2px) rotate(-1deg); }
            75% { transform: translate(-1px, 2px) rotate(0deg); }
            100% { transform: translate(2px, -1px) rotate(-1deg); }
        }

        /* --- The pentagram ---
           Hidden until "Leave this place". The whole drawing uses currentColor,
           so one CSS color paints every part of it. */
        .pentagram-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 92vmin;
            height: 92vmin;
            transform: translate(-50%, -50%) scale(0.9);
            z-index: 5;
            pointer-events: none;
            color: #ff1a1a;
            opacity: 0;
            visibility: hidden;
        }
        .pentagram-bg svg { display: block; width: 100%; height: 100%; }

        /* Phase 2: the screen bleeds red and the pentagram appears with it.
           When the screen is red the pentagram turns black, when it is black the pentagram is red:
           it is always readable. Under 3 flashes a second, to stay safe for photosensitive people. */
        body.possessed { animation: blood 0.5s steps(1, end) infinite; }
        @keyframes blood {
            0%   { background-color: #000; }
            50%  { background-color: #8a0000; }
        }
        .pentagram-active {
            visibility: visible;
            animation: sigil-in 0.18s ease-out forwards, sigil 0.5s steps(1, end) infinite;
        }
        @keyframes sigil-in {
            from { opacity: 0; transform: translate(-50%, -50%) scale(1.15); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes sigil {
            0%   { color: #ff1a1a; }
            50%  { color: #000; }
        }

        /* People who asked their system for less motion: no shaking, no flashing */
        @media (prefers-reduced-motion: reduce) {
            .glitch-text::before, .glitch-text::after, .shake-active { animation: none; }
            body.possessed { animation: none; background-color: #200000; }
            .pentagram-active { animation: none; opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>

    <script>
        // --- CONFIGURATION ---
        const DESTINATION_URL = "https://r0mb0.github.io/Enter_the_nightmaire/";
        const PHASE_SECONDS = 1.5;   // how long each screen lasts: Loading, System error, Leave this place
        // ----------------------
        const ms = PHASE_SECONDS * 1000;

        const text = document.getElementById('text');
        const wrapper = document.getElementById('wrapper');
        const pentagram = document.getElementById('pentagram');

        function setText(t) {
            text.textContent = t;
            text.setAttribute('data-text', t);
        }

        // Phase 1: slight anomaly
        setTimeout(() => {
            setText("S̸Y̶S̷T̸E̶M̵ ̷E̶R̵R̶O̷R̸");
            document.body.style.backgroundColor = "#050000";
        }, ms);

        // Phase 2: full possession: red screen and pentagram together
        setTimeout(() => {
            setText("L̷E̸A̶V̵E̶ ̸T̷H̵I̶S̶ ̵P̷L̸A̷C̶E̵");
            document.body.style.backgroundColor = "";
            document.body.classList.add('possessed');
            wrapper.classList.add('shake-active');
            pentagram.classList.add('pentagram-active');
        }, 2 * ms);

        // Phase 3: go to the game. replace(): the back button does not return here
        setTimeout(() => {
            window.location.replace(DESTINATION_URL);
        }, 3 * ms);
    </script>
